<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ian’s Room — Applications Closed Until Summer 2027</title>
  <meta name="description" content="I’m not taking on new coaching clients until summer 2027. Follow along on YouTube for free videos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --accent: #1a9c6d;
      --accent-hover: #158a5e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .notice {
      width: 100%;
      max-width: 760px;
      text-align: center;
      animation: fadeIn 0.6s ease-out both;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(32px, 5vw, 56px);
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 28px;
    }

    .notice p {
      color: var(--muted);
      margin-bottom: 16px;
    }

    .btn-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 60px;
      min-width: 280px;
      padding: 0 32px;
      margin-top: 24px;
      background: var(--accent);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-cta:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-cta svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 56px;
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .notice { animation: none; }
      .btn-cta { transition: none; }
    }

    @media (max-width: 768px) {
      body { font-size: 17px; }
    }

    @media (max-width: 479px) {
      .btn-cta { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="notice">
      <h1>Applications Are Closed Until <span style="color:#1a9c6d">Summer 2027</span></h1>
      <p>Quick update from me. I’m not taking on new coaching clients until summer 2027 because my schedule is full right now.</p>
      <p>In the meantime, I’ll keep posting free videos on YouTube.</p>
      <a class="btn-cta" href="https://www.youtube.com/@IansRoom" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/>
        </svg>
        Watch On YouTube
      </a>
      <p class="footer">© 2026 Ian’s Room. All Rights Reserved.</p>
    </div>
  </main>
</body>
</html>
